name: Update README cards

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours at :17 (UTC); runs at :00 are the most delayed or dropped by GitHub

  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  # Runs the third-party card renderers with a read-only token, so even a
  # malicious version could not write to the repository.
  # Each renderer writes its card only on success and continue-on-error lets
  # the others run, so a failed card keeps the previous file from the checkout.
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # core_version '' uses the renderer version locked in the action instead
      # of installing the latest 2.x from npm on every run. fail_on_error stops
      # it from writing a "Something went wrong" card.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        continue-on-error: true
        with:
          card: stats
          options: username=SoaresCRF&include_all_commits=true&layout=compact&theme=radical&hide_border=true&bg_color=00000000&custom_title=My GitHub Statistics
          path: assets/stats.svg
          token: ${{ secrets.CARDS_TOKEN }}
          core_version: ''
          fail_on_error: 'true'

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        continue-on-error: true
        with:
          card: top-langs
          options: username=SoaresCRF&langs_count=8&layout=compact&theme=radical&hide_border=true&bg_color=00000000
          path: assets/top-langs.svg
          token: ${{ secrets.CARDS_TOKEN }}
          core_version: ''
          fail_on_error: 'true'

      - name: Generate trophy card
        uses: ryo-ma/github-profile-trophy@e3c89df995e92e67cdd4b2acaab9d974583dc1f7 # master; release v1.0 lacks the theme input
        continue-on-error: true
        with:
          username: SoaresCRF
          output_path: assets/trophy.svg
          token: ${{ secrets.CARDS_TOKEN }}
          theme: radical

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@d855de1a23fe45bdda5ffbc28a6d4b80b0f107e1 # v1.8.0
        continue-on-error: true
        with:
          options: user=SoaresCRF&theme=radical&hide_border=true&background=transparent&stroke=transparent
          path: assets/streak.svg
          token: ${{ secrets.CARDS_TOKEN }}

      # Only these four files reach the publish job, so the renderers cannot
      # change anything else in the repository.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cards
          path: |
            assets/stats.svg
            assets/top-langs.svg
            assets/trophy.svg
            assets/streak.svg
          if-no-files-found: error
          retention-days: 1

  # Only runs trusted steps with the write token.
  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cards
          path: assets

      - name: Commit and push if changed
        run: |
          git add assets/
          if git diff --staged --quiet; then
            echo "No card changed, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update README cards"
          # A manual push to main may have landed during the run.
          git pull --rebase
          git push
