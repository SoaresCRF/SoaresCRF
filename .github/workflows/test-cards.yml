name: Test card update script

on:
  push:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/test-cards.yml'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/test-cards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run offline test
        run: bash .github/scripts/test-update-cards.sh
