name: Generate Space Shooter

on:
  schedule:
    - cron: '0 0 * * *' # daily at midnight UTC

  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

# Same steps as the czl9707/gh-space-shooter action, inlined so the Python
# packages are installed at pinned versions instead of the latest from PyPI.
env:
  OUTPUT_FILE: space-shooter.webp
  COMMIT_MESSAGE: 'chore: generate space shooter animation'

jobs:
  # Runs the third-party generator with a read-only token, so even a malicious
  # package version could not write to the repository.
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install generator
        run: pip install -r .github/space-shooter/requirements.txt

      - name: Generate game
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh-space-shooter "${{ github.repository_owner }}" --output "$OUTPUT_FILE" --strategy random --fps 60

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: space-shooter
          path: ${{ env.OUTPUT_FILE }}
          if-no-files-found: error
          retention-days: 1

  # Only runs trusted steps with the write token. The ~1.2 MB animation goes to
  # the output branch, so a single amended commit is kept there instead of
  # growing main's history daily.
  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: output
          fetch-depth: 2 # required for the amend logic

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: space-shooter
          path: .

      - name: Commit and push
        run: |
          git add "$OUTPUT_FILE"
          if git diff --staged --quiet; then
            echo "Animation unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"

          last_message=$(git log -1 --pretty=%s)
          last_files=$(git log -1 --name-only --pretty=format: | grep -v '^$')
          if [ "$last_message" = "$COMMIT_MESSAGE" ] && [ "$last_files" = "$OUTPUT_FILE" ]; then
            echo "Amending previous animation commit."
            git commit --amend --no-edit
            git push --force-with-lease
          else
            git commit -m "$COMMIT_MESSAGE"
            git push
          fi
