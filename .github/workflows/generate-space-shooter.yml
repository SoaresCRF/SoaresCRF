name: Generate Space Shooter

on:
  schedule:
    - cron: '0 0 * * *' # daily at midnight UTC

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  update-game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2 # required for the amend logic

      - uses: czl9707/gh-space-shooter@eea3dd4d83e464ec7c4153e09e303952b924f5c5 # v2.0.5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: SoaresCRF
          output-path: 'space-shooter.webp'
          strategy: 'random'
          fps: '60'
          commit-message: 'Generate Space Shooter'
