name: Update space shooter game GIF

on:
  schedule:
    - cron: '0 0 * * *' # daily at midnight UTC

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2 # required for the amend logic

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: SoaresCRF
          output-path: 'space-shooter.gif'
          strategy: 'random'
